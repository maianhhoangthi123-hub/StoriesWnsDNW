<!-- MODAL ĐỌC TRUYỆN (TRÌNH ĐỌC FULL MÀN HÌNH) -->
  <div id="readerModal" class="modal-overlay" style="display: none;">
    <div class="modal-content reader-modal-content">
      <!-- Tiêu đề truyện & chương -->
      <div class="reader-header">
        <div>
          <h3 id="readerStoryTitle">Tên truyện</h3>
          <h2 id="readerChapterTitle">Chương 1</h2>
        </div>
        <button type="button" id="closeReaderBtn" class="close-reader-btn">✕</button>
      </div>

      <!-- Điều hướng Tiến / Lùi ở đầu trang đọc -->
      <div class="reader-nav">
        <button type="button" id="prevChapterBtn" class="btn-secondary">⏮️ Chương trước</button>
        
        <select id="readerChapterSelect">
          <!-- Dropdown chọn chương nhanh -->
        </select>

        <button type="button" id="nextChapterBtn" class="btn-secondary">Chương sau ⏭️</button>
      </div>

      <!-- Khung hiển thị nội dung chương -->
      <div id="readerBody">
        <!-- Nội dung chương load ở đây -->
      </div>

      <!-- Điều hướng Tiến / Lùi ở cuối trang đọc -->
      <div class="reader-nav">
        <button type="button" id="prevChapterBtnBottom" class="btn-secondary">⏮️ Chương trước</button>
        <button type="button" id="nextChapterBtnBottom" class="btn-secondary">Chương sau ⏭️</button>
      </div>
    </div>
  </div>
